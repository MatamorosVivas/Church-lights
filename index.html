<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Philips Hue controller</h1>
        <p class="subtitle">Control lights</p>

        <div class="controls-grid">
            <div class="control-card">
                <h2>Power</h2>
                <div class="button-group">
                    <button id="on-btn">ON</button>
                    <button id="off-btn">OFF</button>
                </div>
            </div>

            <div class="control-card">
                <label for="brightness-slider"><h2>Brightness</h2></label>
                <input type="range" min="1" max="100" value="100" class="slider" id="brightness-slider">
            </div>

            <div class="control-card">
                <label for="color-picker"><h2>Color</h2></label>
                <input type="color" id="color-picker" value="#ffc40c">
            </div>
        </div>

        <p id="status-message">Ready</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
